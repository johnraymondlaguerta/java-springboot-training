server:
  port: 8761            # the registry itself must have a known address

spring:
  application:
    name: eureka-server

eureka:
  client:
    register-with-eureka: false   # the registry does not register with itself
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
